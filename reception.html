<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0d0b09">
<title>SORTEN Dress Up Party ｜ 受付</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0d0b09; --panel:#16130f; --gold:#c9a961; --line:rgba(201,169,97,.28);
  --text:#eee4cd; --muted:#a99c80;
  --ok:#1f8a4c; --used:#c0392b; --warn:#d4a017; --none:#5d5a55;
  --serif:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",sans-serif;
  --latin:"Zen Kaku Gothic New","Hiragino Sans",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--serif);font-weight:500;line-height:1.7;min-height:100vh;
  font-variant-numeric:lining-nums;-webkit-font-smoothing:antialiased}
.wrap{max-width:520px;margin:0 auto;padding:28px 16px 40px}
.brand{text-align:center;font-family:var(--latin);letter-spacing:.24em;color:var(--gold);font-size:13px;margin-bottom:18px}

/* 受付スタッフ用の判定カード */
.card{border-radius:4px;padding:30px 20px 26px;text-align:center;color:#fff}
.card .big{font-size:36px;font-weight:900;letter-spacing:.1em;line-height:1.3}
.card .name{font-size:26px;font-weight:700;margin-top:14px}
.card .seat{font-family:var(--latin);font-weight:900;font-size:68px;line-height:1;margin-top:10px}
.card .seat small{display:block;font-family:var(--serif);font-size:14px;opacity:.85;margin-top:6px}
.card .note{font-size:16px;font-weight:700;margin-top:14px}
.ok{background:var(--ok)} .used{background:var(--used)} .none{background:var(--none)} .wait{background:var(--panel);border:1px solid var(--line);color:var(--muted)}
.pay{margin-top:12px;background:var(--warn);color:#1a1405;border-radius:4px;padding:12px 14px;font-weight:900;font-size:16px;text-align:center}
.hint{margin-top:16px;border:1px solid var(--line);border-radius:6px;padding:14px 16px;font-size:16px;font-weight:700;color:var(--text);text-align:center;line-height:1.6}
.hint small{display:block;font-size:13px;font-weight:500;color:var(--muted);margin-top:4px}
.staff{margin-top:26px;font-size:11px;color:#6d6452;text-align:center}

/* ゲストが自分のQRを読んだとき */
.guest{border:1px solid var(--gold);padding:30px 20px;text-align:center;position:relative}
.guest:before{content:"";position:absolute;inset:5px;border:1px solid var(--line);pointer-events:none}
.guest h1{font-family:var(--latin);font-weight:900;font-size:30px;color:#f3e7c8;line-height:1.2}
.guest p{font-size:15px;margin-top:16px}
.guest .sub{font-size:13px;color:var(--muted)}
.btn{display:block;margin:22px auto 0;max-width:300px;padding:14px 10px;background:var(--gold);color:#16120b;
  text-decoration:none;font-weight:600;letter-spacing:.12em;position:relative;z-index:1}

/* 画面の中でQRを読む */
.scan{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;margin-top:16px;padding:18px 10px;border:0;border-radius:8px;
  background:var(--gold);color:#16120b;font:inherit;font-weight:900;font-size:20px;letter-spacing:.06em;cursor:pointer}
.scan svg{width:26px;height:26px}
.cam{position:fixed;inset:0;z-index:50;background:#000;display:flex;flex-direction:column}
.cam[hidden]{display:none}
.cam video{flex:1;width:100%;object-fit:cover;min-height:0}
.cam .frame{position:absolute;left:50%;top:42%;width:56vw;max-width:260px;aspect-ratio:1;transform:translate(-50%,-50%);
  border:4px solid var(--gold);border-radius:16px;box-shadow:0 0 0 2000px rgba(0,0,0,.45)}
.cam .msg{position:absolute;left:0;right:0;top:calc(42% + min(28vw,130px) + 18px);text-align:center;color:#fff;font-weight:700;font-size:17px}
.cam .close{margin:16px;padding:16px;border:0;border-radius:8px;background:#2a2620;color:#fff;font:inherit;font-weight:700;font-size:18px}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">DRESS UP PARTY ／ 2026.10.25</div>
  <div id="view"></div>
</div>
<div class="cam" id="cam" hidden><video id="video" playsinline muted></video><div class="frame"></div><div class="msg" id="camMsg">QRから20cmほど離して、枠に合わせてください</div><button class="close" id="camClose">閉じる</button></div>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
<script>
// 受付用Webアプリ（Apps Script）のURL。デプロイ後にここへ入れる
const EXEC_URL = "https://script.google.com/macros/s/AKfycbxWsfIWWhyPOpCKbZ5ANjo4TZn_zJXciMNqoxdEJlT635HT791QATFoS54aCQtPqI3_SQ/exec";
const view = document.getElementById("view");
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

// 受付スマホの登録：reception.html#staff=キー を一度開くと、この端末が受付用になる
function staffKey(){
  const m = location.hash.match(/staff=([0-9a-f]+)/);
  try {
    if (m) { localStorage.setItem("dup_staff", m[1]); history.replaceState(null, "", location.pathname + location.search); }
    return localStorage.getItem("dup_staff");
  } catch (e) { return m ? m[1] : null; }
}

function guestView(){
  view.innerHTML = `<div class="guest">
    <h1>Welcome</h1>
    <p>ようこそ、お越しくださいました。<br>当日は受付で、この招待状の画面をご提示ください。</p>
    <p class="sub">10月25日（日）17:30 受付開始<br>ヒルトン名古屋 ONE O FIVE</p>
    <p class="sub">席次・プログラムは、会場のスクリーンに映すQRからご覧いただけます。</p>
  </div>`;
}

// 入場時刻は「17:42」の形にそろえる
function hhmm(v){
  if (/^\d{1,2}:\d{2}$/.test(v || "")) return v;
  const d = new Date(v);
  return isNaN(d) ? (v || "") : d.toLocaleTimeString("ja-JP", {timeZone: "Asia/Tokyo", hour: "2-digit", minute: "2-digit"});
}

function show(r){
  r.time = hhmm(r.time);
  const seat = r.seat ? `<div class="seat">${esc(r.seat)}<small>テーブル${esc(String(r.seat).split("-")[0])}へご案内</small></div>` : "";
  const pay = r.payment === "未入金" ? `<div class="pay">未入金の方です。お名前を名簿担当へ</div>` : "";
  const map = {
    ok:     ["ok",   "入場OK",     `<div class="name">${esc(r.name)} 様</div>${seat}<div class="note">${esc(r.time)} に入場を記録しました</div>`],
    used:   ["used", "使用済み",   `<div class="name">${esc(r.name)} 様</div>${seat}<div class="note">${esc(r.time)} に入場済みです。ご本人なら通してOK。別の方の可能性があればEIKOへ</div>`],
    cancel: ["none", "キャンセル", `<div class="name">${esc(r.name)} 様</div><div class="note">台帳でキャンセル扱いの招待状です。お名前を伺って名簿担当へ</div>`],
    invalid:["none", "無効",       `<div class="note">台帳にない招待状です。お名前を伺って、名前で受付（方法B）をしてください</div>`],
    error:  ["none", "通信エラー", `<div class="note">記録できませんでした。名前で受付（方法B）をしてください</div>`]
  };
  const [cls, big, body] = map[r.status] || map.error;
  view.innerHTML = `<div class="card ${cls}"><div class="big">${big}</div>${body}</div>${pay}
    ${SCAN_BTN}
    ${key ? `<div class="staff">受付用の端末として登録済み</div>` : ""}`;
}

function check(token, key){
  view.innerHTML = `<div class="card wait"><div class="big">確認中…</div></div>`;
  if (!/^https:/.test(EXEC_URL)) { show({status:"error"}); return; }
  const cb = "cb" + Date.now();
  const s = document.createElement("script");
  const timer = setTimeout(() => show({status:"error"}), 15000);
  window[cb] = r => { clearTimeout(timer); delete window[cb]; s.remove(); r.status === "guest" ? guestView() : show(r); };
  s.onerror = () => { clearTimeout(timer); show({status:"error"}); };
  s.src = `${EXEC_URL}?t=${encodeURIComponent(token)}&k=${encodeURIComponent(key)}&callback=${cb}`;
  document.body.appendChild(s);
}

// ===== 受付練習モード（PRAC- で始まるQRは台帳に記録せず、この端末の中だけで判定する） =====
const PRACTICE = {
  "PRAC-01": {name:"練習　一郎", seat:"A-1", payment:"確定"},
  "PRAC-02": {name:"練習　花子", seat:"B-3", payment:"確定"},
  "PRAC-03": {name:"練習　次郎", seat:"C-5", payment:"未入金"},
  "PRAC-04": {name:"練習　三郎", seat:"",    payment:"キャンセル"},
  "PRAC-05": {name:"練習　春子", seat:"D-2", payment:"確定"}
};
function practice(token){
  let used = {};
  try { used = JSON.parse(localStorage.getItem("dup_prac") || "{}"); } catch (e) {}
  const save = () => { try { localStorage.setItem("dup_prac", JSON.stringify(used)); } catch (e) {} };
  if (token === "PRAC-RESET") {
    save(used = {});
    view.innerHTML = `<div class="card wait"><div class="big">練習リセット</div><div class="note">練習の記録を消しました。最初からやり直せます。</div></div>`;
    return;
  }
  const g = PRACTICE[token];
  const now = new Date().toLocaleTimeString("ja-JP", {timeZone:"Asia/Tokyo", hour:"2-digit", minute:"2-digit"});
  let r;
  if (!g) r = {status:"invalid"};
  else if (g.payment === "キャンセル") r = Object.assign({status:"cancel"}, g);
  else if (used[token]) r = Object.assign({status:"used", time:used[token]}, g);
  else { used[token] = now; save(); r = Object.assign({status:"ok", time:now}, g); }
  show(r);
  view.insertAdjacentHTML("afterbegin", `<div class="pay" style="margin:0 0 12px;background:#7d5ba6;color:#fff">練習モード（台帳には記録されません）</div>`);
}


// ===== 画面の中でQRを読む（カメラアプリに切り替えなくていい） =====
const SCAN_BTN = `<button class="scan" onclick="openScanner()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3M7 12h10"/></svg>次のQRを読む</button>
  <div class="hint" style="border:0;padding:8px 0 0;font-size:13px;font-weight:500;color:var(--muted)">うまく読めないときは、スマホのカメラアプリで読んでもOK</div>`;
let stream = null, scanning = false, detector = null;
const cam = document.getElementById("cam"), video = document.getElementById("video");
const canvas = document.createElement("canvas"), ctx = canvas.getContext("2d", {willReadFrequently: true});
if ("BarcodeDetector" in window) { try { detector = new BarcodeDetector({formats: ["qr_code"]}); } catch (e) {} }


// 背面のメインカメラを選ぶ（Galaxyなどは広角カメラが選ばれてピントが合わないことがある）
const HQ = {width: {ideal: 1920}, height: {ideal: 1080}};
async function startCamera(){
  let st = await navigator.mediaDevices.getUserMedia({video: Object.assign({facingMode: {ideal: "environment"}}, HQ), audio: false});
  try {
    const cams = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === "videoinput");
    const back = cams.filter(d => /back|rear|environment|背面|外側/i.test(d.label));
    // Androidのメイン背面カメラは「camera2 0」「camera 0」のような名前が多い
    const main = back.find(d => /\b0\b/.test(d.label)) || back[0];
    const cur = st.getVideoTracks()[0].getSettings().deviceId;
    if (main && main.deviceId && main.deviceId !== cur) {
      st.getTracks().forEach(t => t.stop());
      st = await navigator.mediaDevices.getUserMedia({video: Object.assign({deviceId: {exact: main.deviceId}}, HQ), audio: false});
    }
  } catch (e) {}
  return st;
}
// ピントを合わせ続ける＋少しズーム（離して構えても読めるように）
async function tuneTrack(track){
  if (!track || !track.getCapabilities) return;
  const caps = track.getCapabilities(), adv = {};
  if (caps.focusMode && caps.focusMode.includes("continuous")) adv.focusMode = "continuous";
  if (caps.zoom) adv.zoom = Math.min(caps.zoom.max, Math.max(caps.zoom.min, 1.8));
  if (Object.keys(adv).length) { try { await track.applyConstraints({advanced: [adv]}); } catch (e) {} }
}

async function openScanner(){
  cam.hidden = false;
  document.getElementById("camMsg").textContent = "QRから20cmほど離して、枠に合わせてください";
  try {
    stream = await startCamera();
    video.srcObject = stream; await video.play();
    tuneTrack(stream.getVideoTracks()[0]);
    scanning = true; requestAnimationFrame(loop);
  } catch (e) {
    document.getElementById("camMsg").textContent = "カメラを使えませんでした。カメラの許可を確認するか、カメラアプリで読んでください";
  }
}
function closeScanner(){
  scanning = false;
  if (stream) stream.getTracks().forEach(t => t.stop());
  stream = null; cam.hidden = true;
}
document.getElementById("camClose").onclick = closeScanner;

async function loop(){
  if (!scanning) return;
  let text = null;
  if (video.readyState >= 2) {
    if (detector) {
      try { const r = await detector.detect(video); if (r.length) text = r[0].rawValue; } catch (e) { detector = null; }
    } else if (window.jsQR) {
      const w = video.videoWidth, h = video.videoHeight, s = Math.min(1, 720 / Math.max(w, h));
      canvas.width = w * s; canvas.height = h * s;
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      const img = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const r = jsQR(img.data, img.width, img.height, {inversionAttempts: "dontInvert"});
      if (r) text = r.data;
    }
  }
  if (text) { onScanned(text); return; }
  setTimeout(() => requestAnimationFrame(loop), 120);
}

function onScanned(text){
  let t = null;
  try { t = new URL(text).searchParams.get("t"); } catch (e) { t = text.trim(); }
  if (!t) { document.getElementById("camMsg").textContent = "招待状のQRではないようです"; setTimeout(() => requestAnimationFrame(loop), 1200); return; }
  if (navigator.vibrate) navigator.vibrate(120);
  closeScanner();
  history.replaceState(null, "", location.pathname + "?t=" + encodeURIComponent(t));
  route(t);
}

function route(t){
  if (t && t.startsWith("PRAC-")) practice(t);
  else if (!key) guestView();
  else check(t, key);
}

const token = new URLSearchParams(location.search).get("t");
const key = staffKey();
if (token && token.startsWith("PRAC-")) { practice(token); }
else
if (!key) guestView();
else if (!token) view.innerHTML = `<div class="card wait"><div class="big">受付準備OK</div><div class="note">この端末は受付用に登録されました。<br>下のボタンを押して、招待状のQRを読んでください。</div></div>${SCAN_BTN}`;
else check(token, key);
</script>
</body>
</html>
